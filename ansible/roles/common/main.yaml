---
- name: Disable apt auto-updates and notifiers
  systemd:
    name: "{{ item }}"
    enabled: no
    state: stopped
  loop:
    - unattended-upgrades
    - apt-daily.service
    - apt-daily-upgrade.service
    - apt-daily.timer
    - apt-daily-upgrade.timer
  become: yes
  ignore_errors: yes

- name: Remove update-notifier
  apt:
    name:
      - update-notifier-common
      - update-manager-core
    state: absent
    purge: yes
  become: yes
  ignore_errors: yes

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: Install base packages
  apt:
    name:
      - curl
      - wget
      - git
      - unzip
      - ca-certificates
      - gnupg
      - apt-transport-https
    state: present
  become: yes

- name: Set hostname
  hostname:
    name: "{{ inventory_hostname }}"
  become: yes

- name: Set timezone
  timezone:
    name: UTC
  become: yes

- name: Disable swap
  command: swapoff -a
  become: yes

- name: Remove swap from fstab
  lineinfile:
    path: /etc/fstab
    regexp: '.*swap.*'
    state: absent
  become: yes

- name: Configure systemd-resolved to use Pi-hole
  copy:
    dest: /etc/systemd/resolved.conf
    content: |
      [Resolve]
      DNS=10.0.0.56
      FallbackDNS=1.1.1.1
      Domains=homelab.internal
      DNSStubListener=no
  become: yes
  notify: restart systemd-resolved

- name: Point resolv.conf to systemd-resolved
  file:
    path: /etc/resolv.conf
    src: /run/systemd/resolve/resolv.conf
    state: link
    force: yes
  become: yes