[defaults]
inventory = /home/josephgonzalez/github/k8s-homelab/ansible/inventory/hosts.ini
private_key_file = /home/josephgonzalez/.ssh/homelab
host_key_checking = False
remote_user = ubuntu
interpreter_python = /usr/bin/python3

[inventory]
enable_plugins = yaml, ini, auto

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -J proxmox